[project]
name = "strands-governance-workshop"
version = "0.1.0"
description = "Three bank desks built with Strands Agents on one Neo4j graph, with every tool call governed by Arcade."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[anthropic,otel]>=1.64,<2",
    "strands-agents-evals>=1.9,<2",
    "arcadepy>=1.8,<2",
    "neo4j>=6,<7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
prod = ["bedrock-agentcore>=1.0"]

[project.scripts]
ask = "bank_agent.cli:ask"
approve = "bank_agent.cli:approve"
tools = "bank_agent.cli:tools"
evals = "bank_agent.evals.run:main"
gate = "bank_gate.server:main"
seed = "bank_graph.seed:main"
staff = "bank_graph.seed:staff_main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "arcade-mcp-server>=1.33,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/bank_agent", "gate/bank_gate", "neo4j/bank_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["mcp", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140

[tool.ruff.lint.isort]
known-first-party = ["bank_agent", "bank_gate", "bank_graph", "bank_tools", "support"]
