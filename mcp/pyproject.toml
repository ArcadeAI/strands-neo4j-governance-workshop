[project]
name = "bank_tools"
version = "1.0.0"
description = "The Bank MCP server: payments, AML, corporate banking and approval tools over one Neo4j graph, deployed to Arcade with one `arcade deploy` under one toolkit name, Bank."
requires-python = ">=3.11"
dependencies = [
    "arcade-mcp-server>=1.33.0,<2.0.0",
    "neo4j>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "arcade-mcp[all]>=1.15.0,<2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

# Tells Arcade this package carries Arcade tools.
[project.entry-points.arcade_toolkits]
toolkit_name = "bank_tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bank_tools"]
